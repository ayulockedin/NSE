name: Test Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the CPU-only torch build first so the CUDA wheels (multi-GB)
          # are never pulled in CI. requirements.txt then sees torch satisfied.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check nse

      - name: Run tests
        # Docker sandbox tests auto-skip here (no nse-sandbox image is built),
        # and the e2e tests use injected fake agents + the local sandbox, so no
        # mock LLM server or GPU is required.
        run: pytest -q
